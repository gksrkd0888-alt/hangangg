<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한강 악보장</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0e0f;--sur:#1a1a1c;--sur2:#242428;--bor:#2e2e33;--acc:#d4a843;--acc2:#e8c876;--txt:#f0ede8;--mut:#888;--pur:#9b7fe8;--grn:#5cb87a;--red:#e8605c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'Noto Sans KR',sans-serif;min-height:100vh;overflow-x:hidden}
header{padding:1rem 1.5rem;border-bottom:1px solid var(--bor);display:flex;align-items:center;gap:1rem;background:var(--bg);position:sticky;top:0;z-index:100}
.logo{font-family:'Black Han Sans',sans-serif;font-size:1.4rem;color:var(--acc)}
.logo small{font-size:.75rem;color:#555;font-weight:400;margin-left:.5rem;font-family:'Noto Sans KR',sans-serif}
nav{margin-left:auto;display:flex;gap:4px}
.nb{padding:6px 16px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--mut);cursor:pointer;font-size:.82rem;font-family:'Noto Sans KR',sans-serif;transition:all .15s}
.nb.active{color:var(--acc);border-color:var(--acc);background:#1a1800}
.nb:hover:not(.active){background:var(--sur);color:var(--txt)}
.sec{display:none}.sec.active{display:block}
main{max-width:1060px;margin:0 auto;padding:1.5rem}

/* chord dict */
.stabs{display:flex;gap:6px;margin-bottom:1.25rem}
.stab{padding:5px 16px;border-radius:20px;border:1px solid var(--bor);background:transparent;color:var(--mut);cursor:pointer;font-size:.8rem;font-family:'Noto Sans KR',sans-serif;transition:all .15s}
.stab.active{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700}
.csub{display:none}.csub.active{display:block}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:1.25rem}
.ccard{background:var(--sur);border:1px solid var(--bor);border-radius:10px;padding:10px;cursor:pointer;transition:all .18s;text-align:center;position:relative}
.ccard:hover{border-color:var(--acc);transform:translateY(-2px)}
.ccard.sel{border-color:var(--acc);background:#1a1800;box-shadow:0 0 0 1px var(--acc)}
.cn{font-size:1.1rem;font-weight:700;color:var(--acc);margin-bottom:2px;font-family:'Space Mono',monospace}
.ct{font-size:.7rem;color:#666;margin-bottom:6px}

/* popup overlay */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center}
.overlay.show{display:flex}
.popup{background:var(--sur);border:1px solid var(--bor);border-radius:14px;padding:1.5rem;max-width:340px;width:90%;position:relative;animation:popIn .2s ease}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.popup-close{position:absolute;top:10px;right:14px;background:transparent;border:none;color:var(--mut);font-size:1.2rem;cursor:pointer;line-height:1}
.popup h3{font-family:'Space Mono',monospace;font-size:1.3rem;color:var(--acc);margin-bottom:.4rem}
.popup p{font-size:.85rem;color:var(--mut);line-height:1.7;margin-bottom:.75rem}
.popup-tags{display:flex;gap:5px;flex-wrap:wrap}
.ptag{padding:2px 9px;border-radius:12px;font-size:.72rem;border:1px solid var(--bor);color:var(--mut)}
.ptag.major{border-color:var(--acc);color:var(--acc)}.ptag.minor{border-color:var(--pur);color:var(--pur)}
.ptag.power{border-color:var(--grn);color:var(--grn)}.ptag.barre{border-color:var(--red);color:var(--red)}

/* songs */
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:.75rem}
.sh h2{font-family:'Black Han Sans',sans-serif;font-size:1.2rem;color:var(--acc)}
.sh-right{display:flex;gap:8px;align-items:center}
.badd{padding:8px 18px;background:var(--acc);color:#000;border:none;border-radius:7px;cursor:pointer;font-weight:700;font-size:.82rem;font-family:'Noto Sans KR',sans-serif;transition:all .15s}
.badd:hover{background:var(--acc2)}

/* filters */
.filters{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.filter-btn{padding:4px 12px;border-radius:20px;border:1px solid var(--bor);background:transparent;color:var(--mut);cursor:pointer;font-size:.75rem;font-family:'Noto Sans KR',sans-serif;transition:all .15s}
.filter-btn.active{background:var(--sur2);color:var(--txt);border-color:#555}
.filter-btn.fav-f.active{border-color:#e8c050;color:#e8c050}
.search-box{padding:5px 12px;border-radius:20px;border:1px solid var(--bor);background:var(--sur);color:var(--txt);font-size:.78rem;font-family:'Noto Sans KR',sans-serif;outline:none;width:160px}
.search-box:focus{border-color:var(--acc)}

/* add form */
.aform{background:var(--sur);border:1px solid var(--bor);border-radius:12px;padding:1.25rem;margin-bottom:1.25rem;display:none}
.aform.open{display:block;animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.ff{grid-column:1/-1}
.fl label{display:block;font-size:.75rem;color:var(--mut);margin-bottom:4px}
.fl input,.fl textarea,.fl select{width:100%;background:var(--bg);border:1px solid var(--bor);border-radius:7px;padding:8px 12px;color:var(--txt);font-family:'Space Mono',monospace;font-size:.85rem;outline:none;transition:border .15s;resize:vertical}
.fl input:focus,.fl textarea:focus,.fl select:focus{border-color:var(--acc)}
.fl textarea{min-height:130px;line-height:1.9}
.hint{font-size:.72rem;color:#555;margin-top:4px;line-height:1.6}
.fbtns{display:flex;gap:8px;margin-top:10px}
.bsave{padding:8px 20px;background:var(--acc);color:#000;border:none;border-radius:7px;cursor:pointer;font-weight:700;font-size:.82rem;font-family:'Noto Sans KR',sans-serif}
.bcan{padding:8px 16px;background:transparent;border:1px solid var(--bor);border-radius:7px;cursor:pointer;color:var(--mut);font-size:.82rem;font-family:'Noto Sans KR',sans-serif}

/* song items */
.si{background:var(--sur);border:1px solid var(--bor);border-radius:11px;margin-bottom:8px;overflow:hidden;transition:all .15s}
.si.favorited{border-color:#c8a840}
.sih{display:flex;align-items:center;padding:.85rem 1.1rem;cursor:pointer;gap:.75rem}
.snum{font-family:'Space Mono',monospace;font-size:.72rem;color:#555;min-width:22px}
.stit{font-size:.95rem;font-weight:500;flex:1}
.sart{font-size:.78rem;color:var(--mut)}
.spills{display:flex;gap:4px;flex-wrap:wrap}
.sp{font-family:'Space Mono',monospace;font-size:.68rem;padding:1px 7px;border-radius:4px;background:var(--bg);border:1px solid var(--bor);color:var(--mut)}
.sact{display:flex;align-items:center;gap:4px;margin-left:auto}
.ib{background:transparent;border:none;cursor:pointer;color:#555;font-size:.9rem;padding:4px 7px;border-radius:5px;transition:all .15s;line-height:1}
.ib:hover{background:var(--sur2);color:var(--txt)}
.ib.del:hover{color:var(--red)}
.ib.fav{font-size:1rem}
.ib.fav.on{color:#e8c050}
.ib.fav:hover{color:#e8c050}
.chev{transition:transform .3s;color:#555;font-size:.8rem;line-height:1}
.si.open .chev{transform:rotate(180deg)}
.sib{display:none;border-top:1px solid var(--bor)}
.si.open .sib{display:block}

/* song body */
.song-toolbar{display:flex;align-items:center;gap:1rem;padding:.75rem 1.1rem;border-bottom:1px solid var(--bor);flex-wrap:wrap}
.toolbar-label{font-size:.75rem;color:var(--mut)}
.transpose-ctrl{display:flex;align-items:center;gap:6px}
.t-btn{width:26px;height:26px;border-radius:50%;border:1px solid var(--bor);background:var(--sur2);color:var(--txt);cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;transition:all .15s;line-height:1;font-family:'Space Mono',monospace}
.t-btn:hover{border-color:var(--acc);color:var(--acc)}
.t-val{font-family:'Space Mono',monospace;font-size:.82rem;color:var(--acc);min-width:40px;text-align:center}
.bpm-display{font-family:'Space Mono',monospace;font-size:.82rem;color:var(--grn);background:var(--bg);padding:3px 10px;border-radius:4px;border:1px solid var(--bor)}
.metronome-btn{padding:3px 10px;border-radius:4px;border:1px solid var(--bor);background:transparent;color:var(--mut);cursor:pointer;font-size:.75rem;font-family:'Noto Sans KR',sans-serif;transition:all .15s}
.metronome-btn.running{border-color:var(--grn);color:var(--grn);background:rgba(92,184,122,.1)}
.smeta{font-size:.75rem;color:#555;padding:.5rem 1.1rem}
/* chord-above-lyric layout */
.lyric-sheet{padding:.9rem 1.1rem;font-family:'Space Mono',monospace;font-size:.82rem;line-height:1.5}
.lyric-para{margin-bottom:1.4rem}
.lyric-line{display:flex;flex-wrap:wrap;align-items:flex-end;margin-bottom:.1rem;position:relative}
.beat-marker{display:inline-flex;flex-direction:column;align-items:flex-start;vertical-align:bottom;position:relative;margin-right:0}
.beat-chord{color:var(--acc);font-weight:700;font-size:.78rem;line-height:1;cursor:pointer;white-space:nowrap;min-height:1em;transition:color .15s;display:block;padding-bottom:2px}
.beat-chord:hover{color:var(--acc2)}
.beat-chord.empty{min-width:0;pointer-events:none}
.beat-lyric{color:var(--txt);font-size:.82rem;line-height:1.6;white-space:pre;display:block}
.beat-bar{display:inline-flex;flex-direction:column;align-items:center;margin:0 4px;padding-bottom:0;vertical-align:bottom}
.beat-bar .bar-line{width:1px;background:#444;height:2.2em;display:block;margin:0 auto}
.beat-bar .bar-num{font-size:.6rem;color:#555;line-height:1;margin-bottom:2px}
.lyric-plain{color:var(--txt);font-size:.82rem;line-height:2;white-space:pre-wrap}
.emp{text-align:center;padding:3rem 2rem;color:#555}
.emp .big{font-size:2.5rem;margin-bottom:.75rem;opacity:.3}
.no-results{text-align:center;padding:2rem;color:#555;font-size:.85rem}
/* artist group */
.artist-group{margin-bottom:1.5rem}
.artist-header{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;padding:.4rem 0;border-bottom:1px solid var(--bor);cursor:pointer;user-select:none}
.artist-name{font-size:.9rem;font-weight:500;color:var(--acc);font-family:'Space Mono',monospace}
.artist-count{font-size:.72rem;color:#555;background:var(--sur2);padding:2px 8px;border-radius:10px}
.artist-chev{color:#555;font-size:.8rem;transition:transform .3s;margin-left:auto}
.artist-group.open .artist-chev{transform:rotate(180deg)}
.artist-songs{display:none}
.artist-group.open .artist-songs{display:block}
/* search bar bigger */
.search-wrap{position:relative;flex:1;max-width:340px}
.search-wrap input{width:100%;padding:7px 14px 7px 34px;border-radius:20px;border:1px solid var(--bor);background:var(--sur);color:var(--txt);font-size:.82rem;font-family:'Noto Sans KR',sans-serif;outline:none;transition:border .15s}
.search-wrap input:focus{border-color:var(--acc)}
.search-wrap .si-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#555;font-size:.85rem;pointer-events:none}
.search-wrap input::placeholder{color:#555}
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closePopup(event)">
  <div class="popup" id="popup">
    <button class="popup-close" onclick="closePopup(null)">✕</button>
    <canvas id="popup-canvas" width="220" height="250" style="display:block;margin:0 auto 1rem"></canvas>
    <h3 id="popup-name"></h3>
    <p id="popup-desc"></p>
    <div class="popup-tags" id="popup-tags"></div>
  </div>
</div>

<header>
  <div class="logo">한강 악보장 <small>Guitar Chord Book</small></div>
  <nav>
    <button class="nb active" onclick="showSec('chords')">코드 사전</button>
    <button class="nb" onclick="showSec('songs')">내 악보</button>
  </nav>
</header>

<main>
<!-- 코드 사전 -->
<div id="chords" class="sec active">
  <div class="stabs">
    <button class="stab active" onclick="showCTab('open')">오픈 코드</button>
    <button class="stab" onclick="showCTab('barre')">바레 코드</button>
    <button class="stab" onclick="showCTab('power')">파워 코드</button>
  </div>
  <div id="co-open" class="csub active"><div class="cgrid" id="go"></div></div>
  <div id="co-barre" class="csub"><div class="cgrid" id="gb"></div></div>
  <div id="co-power" class="csub"><div class="cgrid" id="gp"></div></div>
</div>

<!-- 내 악보 -->
<div id="songs" class="sec">
  <div class="sh">
    <h2>내 악보 <span id="scnt" style="font-size:.8rem;color:#555;font-weight:400"></span></h2>
    <div class="sh-right">
      <button class="badd" onclick="togForm()">+ 새 악보 추가</button>
    </div>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all',this)">전체</button>
    <button class="filter-btn fav-f" onclick="setFilter('fav',this)">★ 즐겨찾기</button>
    <button class="filter-btn" onclick="setFilter('artist',this)">가수별</button>
    <div class="search-wrap">
      <span class="si-icon">🔍</span>
      <input id="search" placeholder="곡명 / 아티스트 검색..." oninput="renderSongs()">
    </div>
  </div>

  <div class="aform" id="af">
    <div class="fg">
      <div class="fl"><label>곡 제목</label><input id="ft" placeholder="예: Wonderful Tonight"></div>
      <div class="fl"><label>아티스트</label><input id="fa" placeholder="예: Eric Clapton"></div>
      <div class="fl"><label>사용 코드 (쉼표 구분)</label><input id="fc" placeholder="예: G, D, Em, C"></div>
      <div class="fl"><label>키 (Key)</label><input id="fk" placeholder="예: G"></div>
      <div class="fl"><label>박자 (time signature)</label>
        <select id="fts">
          <option value="">선택 안함</option>
          <option value="4/4">4/4 박자</option>
          <option value="3/4">3/4 박자</option>
          <option value="6/8">6/8 박자</option>
          <option value="2/4">2/4 박자</option>
          <option value="12/8">12/8 박자</option>
        </select>
      </div>
      <div class="fl"><label>BPM</label><input id="fbpm" type="number" min="40" max="240" placeholder="예: 120"></div>
      <div class="fl ff">
        <label>가사 + 코드</label>
        <textarea id="fly" placeholder="[G]Wonderful tonight, [D]it's late in the [Em]evening...&#10;[C]she's wondering what clothes to [D]wear.&#10;&#10;• 코드는 [G], [Am] 형식으로 가사 바로 앞에 붙이세요&#10;• 빈 줄로 절(verse)을 구분하세요"></textarea>
        <p class="hint">💡 [코드명]가사 형식으로 입력하면 코드가 가사 위에 자동으로 올라가요. 코드 클릭 시 다이어그램 팝업!</p>
      </div>
    </div>
    <div class="fbtns">
      <button class="bsave" onclick="saveSong()">저장</button>
      <button class="bcan" onclick="togForm()">취소</button>
    </div>
  </div>

  <div id="sl"></div>
</div>
</main>

<script>
// ── roundRect 폴리필 (구버전 Safari 등 대응) ──────────────
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    this.moveTo(x+r,y);
    this.lineTo(x+w-r,y);
    this.quadraticCurveTo(x+w,y,x+w,y+r);
    this.lineTo(x+w,y+h-r);
    this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    this.lineTo(x+r,y+h);
    this.quadraticCurveTo(x,y+h,x,y+h-r);
    this.lineTo(x,y+r);
    this.quadraticCurveTo(x,y,x+r,y);
    this.closePath();
    return this;
  };
}
// ── 코드 데이터 ──────────────────────────────────────────
const CHORDS_ALL = {
  open:[
    {name:'C',fingers:[{s:1,f:1,n:1},{s:2,f:2,n:2},{s:3,f:3,n:3}],open:[0,3,5],mute:[5],startFret:1,nf:4,desc:'가장 기본적인 코드. 밝고 따뜻한 울림.',tags:['Major','초급']},
    {name:'Am',fingers:[{s:1,f:1,n:1},{s:2,f:2,n:2},{s:3,f:2,n:3}],open:[0,1,4,5],mute:[5],startFret:1,nf:4,desc:'A 마이너. 부드럽고 약간 슬픈 느낌.',tags:['Minor','초급']},
    {name:'G',fingers:[{s:0,f:3,n:2},{s:1,f:2,n:1},{s:5,f:3,n:3}],open:[2,3,4],mute:[],startFret:1,nf:4,desc:'G 메이저. 개방현이 많아 울림이 풍성.',tags:['Major','초급']},
    {name:'Em',fingers:[{s:1,f:2,n:2},{s:2,f:2,n:3}],open:[0,1,3,4,5],mute:[],startFret:1,nf:4,desc:'E 마이너. 단 두 손가락. 가장 쉬운 코드.',tags:['Minor','초급']},
    {name:'D',fingers:[{s:1,f:3,n:3},{s:2,f:2,n:1},{s:3,f:3,n:2}],open:[3],mute:[4,5],startFret:1,nf:4,desc:'D 메이저. 4·5·6번 줄만 연주.',tags:['Major','초급']},
    {name:'E',fingers:[{s:2,f:1,n:1},{s:3,f:2,n:3},{s:4,f:2,n:2}],open:[0,1,5],mute:[],startFret:1,nf:4,desc:'E 메이저. Am과 함께 자주 등장.',tags:['Major','초급']},
    {name:'Dm',fingers:[{s:1,f:1,n:1},{s:2,f:2,n:2},{s:3,f:3,n:3}],open:[3],mute:[4,5],startFret:1,nf:4,desc:'D 마이너. 슬프고 진지한 분위기.',tags:['Minor','초급']},
    {name:'A',fingers:[{s:1,f:2,n:1},{s:2,f:2,n:2},{s:3,f:2,n:3}],open:[0,4],mute:[5],startFret:1,nf:4,desc:'A 메이저. 4·3·2번 줄 2프렛 나란히.',tags:['Major','초급']},
    {name:'F',fingers:[{s:3,f:2,n:2},{s:4,f:3,n:3},{s:5,f:3,n:4}],open:[],mute:[],barreFret:1,barreFrom:0,startFret:1,nf:4,desc:'1프렛 바레 코드. 초보자 첫 번째 관문!',tags:['Major','바레','중급']},
    {name:'Cadd9',fingers:[{s:1,f:3,n:2},{s:2,f:2,n:1},{s:5,f:3,n:3}],open:[0,3],mute:[4],startFret:1,nf:4,desc:'C에 9음(D)을 추가. 팝스러운 느낌.',tags:['Add9','중급']},
  ],
  barre:[
    {name:'Bm',fingers:[{s:3,f:4,n:2},{s:4,f:4,n:3},{s:5,f:3,n:4}],open:[],mute:[5],barreFret:2,barreFrom:0,startFret:2,nf:4,desc:'2프렛 바레 마이너. 록 발라드 필수.',tags:['Minor','바레','중급']},
    {name:'B7',fingers:[{s:1,f:2,n:1},{s:2,f:1,n:2},{s:3,f:2,n:3},{s:5,f:2,n:4}],open:[0,3],mute:[4],startFret:1,nf:4,desc:'도미넌트 7th. 블루스·컨트리 분위기.',tags:['7th','중급']},
    {name:'G/B',fingers:[{s:1,f:2,n:1},{s:5,f:3,n:3}],open:[0,2,3],mute:[4],startFret:1,nf:4,desc:'G 코드의 B 베이스. 부드러운 연결.',tags:['Slash','중급']},
    {name:'Fm',fingers:[{s:3,f:3,n:3},{s:4,f:3,n:4}],open:[],mute:[],barreFret:1,barreFrom:0,startFret:1,nf:4,desc:'1프렛 풀 바레 마이너. 어둡고 드라마틱.',tags:['Minor','바레','고급']},
  ],

// 조옮김 노트 목록
const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const ENHARMONIC={'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#'};

function transposeNote(note, semitones){
  const clean=ENHARMONIC[note]||note;
  const idx=NOTES.indexOf(clean);
  if(idx===-1)return note;
  return NOTES[(idx+semitones+12*10)%12];
}

function transposeLine(line, semitones){
  if(semitones===0)return line;
  return line.replace(/\[([^\]]+)\]/g,(m,chord)=>{
    // parse chord: root + suffix
    const match=chord.match(/^([A-G][b#]?)(.*)/);
    if(!match)return m;
    let root=match[1],suffix=match[2];
    // handle slash chord
    const slashMatch=suffix.match(/^(.*?)\/([A-G][b#]?)$/);
    if(slashMatch){
      const bass=transposeNote(slashMatch[2],semitones);
      return `[${transposeNote(root,semitones)}${slashMatch[1]}/${bass}]`;
    }
    return `[${transposeNote(root,semitones)}${suffix}]`;
  });
}

// ── Canvas 프렛보드 그리기 ──────────────────────────────
const DOT_COLORS={1:'#d4a843',2:'#d4a843',3:'#d4a843',4:'#d4a843',5:'#d4a843'};
const STR_COLORS=['#d4c08a','#cbb87e','#c2b072','#b9a866','#b0a05a','#a7984e'];

function drawChord(canvas, chord, W, H){
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,W,H);
  canvas.width=W; canvas.height=H;

  const PL=30,PR=14,PT=34,PB=22;
  const NF=chord.nf||4, NS=6;
  const bw=W-PL-PR, bh=H-PT-PB;
  const sw=bw/(NS-1), fh=bh/NF;
  const sf=chord.startFret||1;

  // background
  ctx.fillStyle='#1a1a1c';
  ctx.beginPath(); ctx.roundRect(0,0,W,H,8); ctx.fill();

  // fretboard area bg
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.roundRect(PL-4,PT-2,bw+8,bh+4,3); ctx.fill();

  // nut
  if(sf===1){
    ctx.fillStyle='#ddd';
    ctx.fillRect(PL-4,PT-5,bw+8,5);
  }

  // horizontal fret lines (white, thin)
  for(let f=0;f<=NF;f++){
    const y=PT+f*fh;
    ctx.strokeStyle=f===0&&sf===1?'transparent':'rgba(255,255,255,0.35)';
    ctx.lineWidth=f===0?0:1;
    ctx.beginPath(); ctx.moveTo(PL-1,y); ctx.lineTo(PL+bw+1,y); ctx.stroke();
  }

  // vertical string lines (white)
  for(let s=0;s<NS;s++){
    const x=PL+s*sw;
    const thick=s<1?1:s<2?1.2:s<4?1.5:s<5?2:2.5;
    ctx.strokeStyle=`rgba(255,255,255,${0.55+s*0.05})`;
    ctx.lineWidth=thick;
    ctx.beginPath(); ctx.moveTo(x,PT); ctx.lineTo(x,PT+bh); ctx.stroke();
  }

  // fret position label
  if(sf>1){
    ctx.fillStyle='#777'; ctx.font='bold 10px monospace'; ctx.textAlign='right';
    ctx.fillText(sf+'fr',PL-8,PT+fh*.55+4);
  }

  // string names bottom
  const snames=['e','B','G','D','A','E'];
  ctx.fillStyle='#666'; ctx.font='9px monospace'; ctx.textAlign='center';
  for(let s=0;s<NS;s++) ctx.fillText(snames[s],PL+s*sw,H-5);

  // chord name top
  ctx.fillStyle='#d4a843'; ctx.font='bold 15px monospace'; ctx.textAlign='center';
  ctx.fillText(chord.name,W/2,19);

  // barre
  if(chord.barreFret!=null){
    const adjF=chord.barreFret-sf+1;
    const by=PT+adjF*fh-fh/2;
    const bxS=PL+(chord.barreFrom||0)*sw, bxE=PL+(NS-1)*sw;
    ctx.fillStyle='rgba(180,140,80,0.85)';
    ctx.beginPath(); ctx.roundRect(bxS-5,by-9,bxE-bxS+10,18,9); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 10px sans-serif'; ctx.textAlign='center';
    ctx.fillText('1',bxS,by+4);
  }

  // mute / open above
  for(let s=0;s<NS;s++){
    const x=PL+s*sw;
    const isMute=chord.mute?.includes(s);
    const isOpen=chord.open?.includes(s);
    if(isMute){ ctx.fillStyle='#e8605c'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.fillText('×',x,PT-7); }
    else if(isOpen){ ctx.strokeStyle='#aaa'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(x,PT-9,4.5,0,Math.PI*2); ctx.stroke(); }
  }

  // finger dots
  chord.fingers.forEach(fi=>{
    if(fi.barre)return;
    const x=PL+fi.s*sw;
    const adjF=fi.f-sf+1;
    const y=PT+adjF*fh-fh/2;
    const col=DOT_COLORS[fi.n]||'#d4a843';
    ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=5; ctx.shadowOffsetY=2;
    ctx.beginPath(); ctx.arc(x,y,11,0,Math.PI*2); ctx.fillStyle=col; ctx.fill();
    ctx.shadowBlur=0; ctx.shadowOffsetY=0;
    ctx.fillStyle='#fff'; ctx.font='bold 10px sans-serif'; ctx.textAlign='center';
    ctx.fillText(fi.n,x,y+4);
  });
}

function buildGrid(id, list){
  const cont=document.getElementById(id); cont.innerHTML='';
  list.forEach(ch=>{
    const card=document.createElement('div'); card.className='ccard';
    const cn=document.createElement('div'); cn.className='cn'; cn.textContent=ch.name;
    const ct=document.createElement('div'); ct.className='ct'; ct.textContent=ch.tags.join(' · ');
    const cv=document.createElement('canvas'); cv.style.display='block'; cv.style.margin='0 auto';
    card.append(cn,ct,cv);
    drawChord(cv,ch,160,190);
    card.onclick=()=>openPopup(ch);
    cont.appendChild(card);
  });
}

// ── 메트로놈 ─────────────────────────────────────────────
let metroCtx=null, metroInterval=null, metroBeat=0, metroBeats=4;
function toggleMetro(btn, bpm, timeSig){
  if(metroInterval){
    clearInterval(metroInterval); metroInterval=null;
    btn.textContent='▶ 메트로놈'; btn.classList.remove('running');
    if(metroCtx){metroCtx.close();metroCtx=null;}
    return;
  }
  const parts=(timeSig||'4/4').split('/');
  metroBeats=parseInt(parts[0])||4;
  metroBeat=0;
  metroCtx=new(window.AudioContext||window.webkitAudioContext)();
  const interval=60000/bpm;
  const tick=()=>{
    const osc=metroCtx.createOscillator();
    const gain=metroCtx.createGain();
    osc.connect(gain); gain.connect(metroCtx.destination);
    osc.frequency.value=metroBeat===0?1200:800;
    gain.gain.setValueAtTime(.3,metroCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,metroCtx.currentTime+.08);
    osc.start(); osc.stop(metroCtx.currentTime+.1);
    metroBeat=(metroBeat+1)%metroBeats;
  };
  tick();
  metroInterval=setInterval(tick,interval);
  btn.textContent='⏹ 정지'; btn.classList.add('running');
}

function renderLyrics(raw, semitones){
  const transposed = transposeLine(raw, semitones);
  const paras = transposed.split(/\n\n+/);

  return paras.map(para => {
    const lines = para.split('\n');
    const lineHtmls = lines.map(line => {
      // 줄에 코드가 하나도 없으면 plain text
      if(!/\[/.test(line)){
        return `<div class="lyric-line"><span class="beat-lyric">${escHtml(line)||'&nbsp;'}</span></div>`;
      }
      // 코드+가사 파싱: 토큰으로 분리
      // 토큰: {chord, lyric} 쌍
      const tokens = [];
      const re = /\[([^\]]+)\]([^\[]*)/g;
      let m, lastEnd = 0;

      // 줄 맨 앞에 코드 없이 가사가 있을 경우
      const firstChord = line.search(/\[/);
      if(firstChord > 0){
        tokens.push({chord:'', lyric: line.slice(0, firstChord)});
        lastEnd = firstChord;
      }

      while((m = re.exec(line)) !== null){
        tokens.push({chord: m[1], lyric: m[2]});
        lastEnd = m.index + m[0].length;
      }

      const beats = tokens.map(tok => {
        const chord = tok.chord;
        const lyric = tok.lyric;
        const root = chord.match(/^([A-G][b#]?)/)?.[1];
        const hasChord = !!chord;
        const clickable = hasChord ? (CHORD_MAP[chord]||CHORD_MAP[root]) : null;
        const chordHtml = hasChord
          ? `<span class="beat-chord${clickable?'':''}" ${clickable?`onclick="openPopup(CHORD_MAP['${escAttr(chord)}']||CHORD_MAP['${escAttr(root)||''}'])"`:''} >${escHtml(chord)}</span>`
          : `<span class="beat-chord empty"></span>`;
        return `<span class="beat-marker">${chordHtml}<span class="beat-lyric">${escHtml(lyric)||''}</span></span>`;
      }).join('');

      return `<div class="lyric-line">${beats}</div>`;
    }).join('');

    return `<div class="lyric-para">${lineHtmls}</div>`;
  }).join('');
}

function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
function escAttr(s){ return (s||'').replace(/'/g,"\\'") }

function renderSongs(){
  const sl=document.getElementById('sl');
  const sc=document.getElementById('scnt');
  const q=(document.getElementById('search')?.value||'').toLowerCase();

  let list=songs.filter(s=>{
    if(filterMode==='fav'&&!s.fav)return false;
    if(q&&!s.title.toLowerCase().includes(q)&&!s.artist.toLowerCase().includes(q))return false;
    return true;
  });

  sc.textContent=songs.length?songs.length+'곡':'';
  if(!songs.length){sl.innerHTML='<div class="emp"><div class="big">🎵</div><p>아직 등록된 악보가 없어요.</p></div>';return}
  if(!list.length){sl.innerHTML='<div class="no-results">검색 결과가 없어요.</div>';return}

  // 가수별 보기
  if(filterMode==='artist'){
    const grouped={};
    list.forEach(s=>{
      const a=s.artist||'알 수 없음';
      if(!grouped[a])grouped[a]=[];
      grouped[a].push(s);
    });
    sl.innerHTML='';
    Object.keys(grouped).sort().forEach(artist=>{
      const grp=document.createElement('div');
      grp.className='artist-group open';
      grp.id='ag-'+encodeURIComponent(artist);
      const songs_in=grouped[artist];
      grp.innerHTML=`
        <div class="artist-header" onclick="togArtist('${encodeURIComponent(artist)}')">
          <span class="artist-name">${artist}</span>
          <span class="artist-count">${songs_in.length}곡</span>
          <span class="artist-chev">▾</span>
        </div>
        <div class="artist-songs" id="as-${encodeURIComponent(artist)}"></div>`;
      sl.appendChild(grp);
      const container=grp.querySelector('.artist-songs');
      songs_in.forEach((s,i)=>container.appendChild(buildSongEl(s,i)));
    });
    return;
  }

  sl.innerHTML='';
  list.forEach((s,i)=>sl.appendChild(buildSongEl(s,i)));
}

function togArtist(enc){
  const grp=document.getElementById('ag-'+enc);
  grp?.classList.toggle('open');
}

function buildSongEl(s,i){
    const st=transposeState[s.id]||0;
    const div=document.createElement('div');
    div.className='si'+(s.fav?' favorited':'');
    div.id='si'+s.id;
    div.classList.toggle('open', !!openState[s.id]);
    const pills=(s.chords||[]).map(c=>{
      const tc=transposeNote(c,st);
      return `<span class="sp">${tc}</span>`;
    }).join('');
    const keyDisp=s.key?transposeNote(s.key,st):'';
    const bpmVal=s.bpm?parseInt(s.bpm):120;
    div.innerHTML=`
      <div class="sih" onclick="togS(${s.id})">
        <span class="snum">${String(i+1).padStart(2,'0')}</span>
        <div style="flex:1;min-width:0">
          <div class="stit">${s.title}</div>
          <div style="display:flex;gap:.5rem;align-items:center;margin-top:3px;flex-wrap:wrap">
            <span class="sart">${s.artist}</span>
            <div class="spills">${pills}</div>
          </div>
        </div>
        <div class="sact">
          <button class="ib fav ${s.fav?'on':''}" onclick="event.stopPropagation();togFav(${s.id})" title="즐겨찾기">${s.fav?'★':'☆'}</button>
          <button class="ib del" onclick="event.stopPropagation();delS(${s.id})" title="삭제">✕</button>
          <span class="chev">▾</span>
        </div>
      </div>
      <div class="sib">
        <div class="song-toolbar">
          <span class="toolbar-label">조옮김</span>
          <div class="transpose-ctrl">
            <button class="t-btn" onclick="changeTranspose(${s.id},-1)">−</button>
            <span class="t-val" id="tv-${s.id}">${st===0?'원조':(st>0?'+'+st:st)}</span>
            <button class="t-btn" onclick="changeTranspose(${s.id},+1)">+</button>
            <button class="t-btn" style="border-radius:4px;width:auto;padding:0 8px;font-size:.7rem" onclick="resetTranspose(${s.id})">리셋</button>
          </div>
          ${keyDisp?`<span class="toolbar-label" style="margin-left:.5rem">Key: <span style="color:var(--acc);font-family:monospace">${keyDisp}</span></span>`:''}
          ${s.timeSig?`<span class="bpm-display">${s.timeSig}</span>`:''}
          ${s.bpm?`<span class="bpm-display">${s.bpm} BPM</span>`:''}
          ${s.bpm?`<button class="metronome-btn" id="mb-${s.id}" onclick="toggleMetro(this,${bpmVal},'${s.timeSig||'4/4'}')">▶ 메트로놈</button>`:''}
        </div>
        ${s.lyrics?`<div class="lyric-sheet">${renderLyrics(s.lyrics,st)}</div>`:'<p style="padding:.9rem 1.1rem;color:#555;font-size:.82rem">가사가 없어요.</p>'}
      </div>`;
    return div;
}

function togS(id){
  openState[id]=!openState[id];
  const el=document.getElementById('si'+id);
  el?.classList.toggle('open',openState[id]);
}
function togFav(id){
  const s=songs.find(x=>x.id===id);
  if(s){s.fav=!s.fav;sv();renderSongs();}
}
function delS(id){
  if(!confirm('이 악보를 삭제할까요?'))return;
  songs=songs.filter(s=>s.id!==id);
  delete transposeState[id];
  sv();renderSongs();
}
function changeTranspose(id,delta){
  transposeState[id]=((transposeState[id]||0)+delta+12)%12;
  if(transposeState[id]>6)transposeState[id]-=12;
  renderSongs();
}
function resetTranspose(id){
  transposeState[id]=0;
  renderSongs();
}

}
